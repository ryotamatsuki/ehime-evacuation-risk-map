name: Analysis Core STEP 2-4 + Corrected Public Export
# Corrected public export baseline main: 0e81b0b880a2492fbfd33b4c7691abdc43acba59

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/processed_population_mesh.csv'
      - 'data/processed_shelters.csv'
      - 'data/tsunami_exposure.csv'
      - 'scripts/download_population.py'
      - 'scripts/build_walking_network.py'
      - 'scripts/calculate_evacuation_routes_v2.py'
      - 'scripts/aggregate_step2_routes.py'
      - 'scripts/calculate_route_exposure_step3.py'
      - 'scripts/calculate_step4_demand_capacity_risk.py'
      - 'scripts/export_corrected_public_data.py'
      - 'tests/test_step2_routing.py'
      - 'tests/test_step3_route_exposure.py'
      - 'tests/test_step4_demand_capacity_risk.py'
      - 'tests/test_final_export.py'
      - 'requirements.txt'
      - '.github/workflows/routing-step2.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: corrected-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: STEP 2A - routing unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests/test_step2_routing.py

  exposure-unit:
    name: STEP 3A - route exposure unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests/test_step3_route_exposure.py

  step4-unit:
    name: STEP 4A - demand capacity risk unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests/test_step4_demand_capacity_risk.py

  final-export-unit:
    name: FINAL A - public export unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests/test_final_export.py

  route:
    name: STEP 2B - route ${{ matrix.code }} ${{ matrix.name }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {code: '38201', name: '松山市'}
          - {code: '38202', name: '今治市'}
          - {code: '38203', name: '宇和島市'}
          - {code: '38204', name: '八幡浜市'}
          - {code: '38205', name: '新居浜市'}
          - {code: '38206', name: '西条市'}
          - {code: '38207', name: '大洲市'}
          - {code: '38210', name: '伊予市'}
          - {code: '38213', name: '四国中央市'}
          - {code: '38214', name: '西予市'}
          - {code: '38356', name: '上島町'}
          - {code: '38401', name: '松前町'}
          - {code: '38442', name: '伊方町'}
          - {code: '38506', name: '愛南町'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download N03 boundary source
        run: >-
          python -c "from pathlib import Path; from scripts.download_population import download, BOUNDARY_URL; download(BOUNDARY_URL, Path('data/raw/N03-20240101_38_GML.zip'))"
      - name: Build corrected walking network for this municipality
        shell: bash
        run: |
          set -euo pipefail
          graph='data/processed_network/${{ matrix.code }}.graphml'
          qa='data/qa/network-step2/${{ matrix.code }}_network.json'
          for attempt in 1 2 3; do
            rm -f "$graph" "$qa"
            python scripts/build_walking_network.py \
              --mesh-csv data/processed_population_mesh.csv \
              --boundary-zip data/raw/N03-20240101_38_GML.zip \
              --out-dir data/processed_network \
              --qa-dir data/qa/network-step2 \
              --municipality '${{ matrix.name }}' \
              --buffer-m 3000 \
              --timeout 180 || true
            if test -s "$graph" && python -c "import json,sys; p=json.load(open('$qa', encoding='utf-8')); sys.exit(0 if p.get('status') == 'complete' else 1)"; then
              echo "network build succeeded on attempt ${attempt}"
              break
            fi
            echo "network build attempt ${attempt} failed"
            if test -f "$qa"; then cat "$qa"; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          test -s "$graph"
          python -c "import json,sys; p=json.load(open('$qa', encoding='utf-8')); sys.exit(0 if p.get('status') == 'complete' else 1)"
      - name: Route tsunami-exposed meshes to all reachable tsunami shelters
        run: >-
          python scripts/calculate_evacuation_routes_v2.py
          --municipality-code '${{ matrix.code }}'
          --mesh-csv data/processed_population_mesh.csv
          --tsunami-exposure-csv data/tsunami_exposure.csv
          --shelters-csv data/processed_shelters.csv
          --boundary-zip data/raw/N03-20240101_38_GML.zip
          --graphml 'data/processed_network/${{ matrix.code }}.graphml'
          --out-csv 'data/step2/routes-${{ matrix.code }}.csv'
          --out-qa 'data/qa/step2/routing-${{ matrix.code }}.json'
          --out-exclusions 'data/qa/step2/shelter-exclusions-${{ matrix.code }}.csv'
          --buffer-m 3000
      - name: Stage municipality routing artifact
        run: |
          mkdir -p artifact
          cp 'data/step2/routes-${{ matrix.code }}.csv' artifact/
          cp 'data/qa/step2/routing-${{ matrix.code }}.json' artifact/
          cp 'data/qa/step2/shelter-exclusions-${{ matrix.code }}.csv' artifact/
          cp 'data/qa/network-step2/${{ matrix.code }}_network.json' artifact/
      - name: Upload municipality routing artifact
        uses: actions/upload-artifact@v4
        with:
          name: routing-step2-${{ matrix.code }}
          path: artifact
          retention-days: 7

  aggregate:
    name: STEP 2C - aggregate 1,090 routes and release gate
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download all municipality route artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: routing-step2-*
          path: step2-artifacts
          merge-multiple: true
      - name: Aggregate and enforce STEP 2 release gate
        run: >-
          python scripts/aggregate_step2_routes.py
          --input-dir step2-artifacts
          --population-csv data/processed_population_mesh.csv
          --tsunami-exposure-csv data/tsunami_exposure.csv
          --expected-network-gap-mesh-ids '493253842,493262112'
          --out-csv data/step2/mesh_routes_v2.csv
          --out-qa data/qa/step2/step2_routing_summary.json
      - name: Preserve municipality QA evidence
        run: |
          mkdir -p data/qa/step2/municipal
          cp step2-artifacts/routing-*.json data/qa/step2/municipal/ || true
          cp step2-artifacts/shelter-exclusions-*.csv data/qa/step2/municipal/ || true
          cp step2-artifacts/*_network.json data/qa/step2/municipal/ || true
      - name: Upload STEP 2 aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-step2-aggregate
          path: |
            data/step2/mesh_routes_v2.csv
            data/qa/step2
          retention-days: 14

  exposure:
    name: STEP 3B - recalculate 1,062 route exposures and release gate
    needs: [aggregate, exposure-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download verified STEP 2 aggregate
        uses: actions/download-artifact@v4
        with:
          name: routing-step2-aggregate
          path: step2-aggregate
      - name: Recalculate route tsunami exposure and enforce STEP 3 gate
        shell: bash
        run: |
          set -euo pipefail
          routes_csv="$(find step2-aggregate -type f -name mesh_routes_v2.csv -print -quit)"
          test -n "$routes_csv"
          python scripts/calculate_route_exposure_step3.py \
            --routes-csv "$routes_csv" \
            --shelters-csv data/processed_shelters.csv \
            --cache .cache/tsunami-step3 \
            --out-csv data/step3/mesh_routes_exposure.csv \
            --out-qa data/qa/step3/step3_route_exposure_summary.json \
            --sample-spacing-m 25 \
            --expected-rows 1090 \
            --expected-complete-routes 1062
      - name: Upload STEP 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-exposure-step3
          path: |
            data/step3/mesh_routes_exposure.csv
            data/qa/step3/step3_route_exposure_summary.json
          retention-days: 14

  step4:
    name: STEP 4B - aggregate demand capacity pressure and risk release gate
    needs: [exposure, step4-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download verified STEP 3 route exposure
        uses: actions/download-artifact@v4
        with:
          name: route-exposure-step3
          path: step3-artifact
      - name: Recalculate STEP 4 demand, shelter pressure, and exploratory risk
        shell: bash
        run: |
          set -euo pipefail
          route_exposure_csv="$(find step3-artifact -type f -name mesh_routes_exposure.csv -print -quit)"
          test -n "$route_exposure_csv"
          python scripts/calculate_step4_demand_capacity_risk.py \
            --route-exposure-csv "$route_exposure_csv" \
            --population-csv data/processed_population_mesh.csv \
            --tsunami-csv data/tsunami_exposure.csv \
            --shelters-csv data/processed_shelters.csv \
            --out-mesh-csv data/step4/mesh_analysis_v4.csv \
            --out-shelter-csv data/step4/shelter_capacity_v4.csv \
            --out-qa data/qa/step4/step4_summary.json \
            --expected-rows 1090 \
            --expected-complete-routes 1062
      - name: Upload STEP 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-step4
          path: |
            data/step4/mesh_analysis_v4.csv
            data/step4/shelter_capacity_v4.csv
            data/qa/step4/step4_summary.json
          retention-days: 14

  final-export:
    name: FINAL B - corrected public export and frontend release gate
    needs: [step4, final-export-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - name: Download verified same-run STEP 4 analysis
        uses: actions/download-artifact@v4
        with:
          name: analysis-step4
          path: step4-artifact
      - name: Export corrected target-only public assets and enforce final data gate
        shell: bash
        run: |
          set -euo pipefail
          mesh_csv="$(find step4-artifact -type f -name mesh_analysis_v4.csv -print -quit)"
          shelter_csv="$(find step4-artifact -type f -name shelter_capacity_v4.csv -print -quit)"
          step4_qa="$(find step4-artifact -type f -name step4_summary.json -print -quit)"
          test -n "$mesh_csv"
          test -n "$shelter_csv"
          test -n "$step4_qa"
          python scripts/export_corrected_public_data.py \
            --mesh-analysis-csv "$mesh_csv" \
            --shelter-capacity-csv "$shelter_csv" \
            --step4-qa "$step4_qa" \
            --shelter-source-csv data/processed_shelters.csv \
            --out-root public/data \
            --out-qa data/qa/final-export/final_export_summary.json \
            --expected-rows 1090 \
            --expected-complete-routes 1062 \
            --expected-cross-border 13 \
            --analysis-source-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
      - name: Verify exported public contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('public/data')
          analysis = json.loads((root/'metadata/analysis.json').read_text(encoding='utf-8'))
          assert analysis['target_meshes'] == 1090
          assert analysis['complete_routes'] == 1062
          assert analysis['route_unavailable'] == 28
          assert analysis['cross_border_routes'] == 13
          risk_index = json.loads((root/'risk/index.json').read_text(encoding='utf-8'))
          route_index = json.loads((root/'routes/index.json').read_text(encoding='utf-8'))
          assert len(risk_index) == 14 and sum(x['feature_count'] for x in risk_index) == 1090
          assert len(route_index) == 14 and sum(x['feature_count'] for x in route_index) == 1090
          qa = json.loads(Path('data/qa/final-export/final_export_summary.json').read_text(encoding='utf-8'))
          assert qa['release_gate']['pass'] is True
          correction = qa['cross_border_metadata_correction']
          assert correction['source_cross_border_true'] == 10
          assert correction['resolved_cross_border_true'] == 13
          assert correction['additional_cross_border_detected'] == 3
          assert correction['resolved_missing_shelter_municipality_rows'] == 26
          PY
      - name: Build corrected Vite site
        run: |
          npm ci
          npm run build
      - name: Verify built Pages artifact contains corrected data
        run: |
          test -s dist/data/metadata/analysis.json
          test -s dist/data/metadata/corrected_manifest.json
          test -s dist/data/risk/index.json
          test -s dist/data/routes/index.json
          test -s dist/data/shelters/capacity_pressure.json
          python - <<'PY'
          import json
          from pathlib import Path
          analysis = json.loads(Path('dist/data/metadata/analysis.json').read_text(encoding='utf-8'))
          assert analysis['analysis_version'] == 'analysis-core-v4-corrected-public'
          assert analysis['target_meshes'] == 1090
          assert analysis['cross_border_routes'] == 13
          PY
      - name: Upload corrected final export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-final-export
          path: |
            public/data/risk
            public/data/routes
            public/data/shelters/capacity_pressure.json
            public/data/metadata/analysis.json
            public/data/metadata/corrected_manifest.json
            data/qa/final-export/final_export_summary.json
          retention-days: 14
      - name: Upload verified GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: FINAL C - deploy corrected GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: final-export
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy corrected site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
