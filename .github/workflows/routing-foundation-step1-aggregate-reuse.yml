name: Routing Foundation STEP 1 Aggregate Reuse

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  aggregate-existing-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download N03 boundary source
        run: >-
          python -c "from pathlib import Path; from scripts.download_population import download, BOUNDARY_URL; download(BOUNDARY_URL, Path('data/raw/N03-20240101_38_GML.zip'))"
      - name: Reuse 14 successful municipal network artifacts from prior STEP 1 run
        uses: actions/download-artifact@v4
        with:
          pattern: routing-step1-network-*
          path: data/processed_network
          merge-multiple: true
          run-id: 32553603544
          github-token: ${{ github.token }}
      - name: Run routing foundation spatial QA
        run: >-
          python scripts/routing_foundation_qa.py
          --mesh-csv data/processed_population_mesh.csv
          --shelters-csv data/processed_shelters.csv
          --boundary-zip data/raw/N03-20240101_38_GML.zip
          --network-dir data/processed_network
          --out-dir data/qa/routing-step1
          --buffer-m 3000
          --border-distance-m 3000
      - name: Select auditable mesh origins and classify network gaps
        run: >-
          python scripts/select_mesh_origins.py
          --mesh-csv data/processed_population_mesh.csv
          --tsunami-exposure-csv data/tsunami_exposure.csv
          --network-dir data/processed_network
          --out-csv data/qa/routing-step1/mesh_origins.csv
          --out-summary data/qa/routing-step1/mesh_origin_selection_summary.json
          --out-outliers data/qa/routing-step1/mesh_origin_outliers.csv
      - name: Record STEP 2 shelter snap policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          df = pd.read_csv('data/qa/routing-step1/shelter_snap_all.csv', encoding='utf-8-sig')
          critical = df[df['snap_status'].eq('critical')].copy()
          payload = {
            'max_candidate_shelter_connector_m': 500,
            'critical_context_records': int(len(critical)),
            'critical_unique_shelters': int(critical['common_id'].nunique()) if len(critical) else 0,
            'policy': 'STEP 2 excludes a shelter candidate in a network context when its OSM connector exceeds 500 m; exclusions are reported, never silently imputed.',
            'critical_records': critical[['context_municipality','common_id','name','shelter_snap_distance_m']].to_dict('records'),
          }
          Path('data/qa/routing-step1/shelter_candidate_policy.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - name: Enforce STEP 1 release gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          foundation = json.loads(Path('data/qa/routing-step1/routing_foundation_summary.json').read_text(encoding='utf-8'))
          origins = json.loads(Path('data/qa/routing-step1/mesh_origin_selection_summary.json').read_text(encoding='utf-8'))
          print('foundation gate:', json.dumps(foundation['release_gate'], ensure_ascii=False, indent=2))
          print('origin gate:', json.dumps(origins['release_gate'], ensure_ascii=False, indent=2))
          if not foundation['release_gate']['network_aoi_is_boundary_based']:
              raise SystemExit('STEP 1 blocked: network AOI is not boundary based')
          if not foundation['release_gate']['all_5821_meshes_snap_checked']:
              raise SystemExit('STEP 1 blocked: not all meshes were checked')
          if not origins['release_gate']['all_meshes_checked']:
              raise SystemExit('STEP 1 blocked: origin classification incomplete')
          if not origins['release_gate']['all_analysis_targets_classified']:
              raise SystemExit('STEP 1 blocked: tsunami-target origin remains unclassified')
          if not origins['release_gate']['network_coverage_gaps_are_explicit']:
              raise SystemExit('STEP 1 blocked: network coverage gaps are not explicit')
          if origins['release_gate']['blocking']:
              raise SystemExit(f"STEP 1 blocked: unresolved targets={origins['release_gate']['analysis_target_unresolved_count']}")
          print('STEP 1 release gate: PASS')
          PY
      - name: Upload aggregate QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-foundation-step1-aggregate-reuse
          path: data/qa/routing-step1
          retention-days: 14
