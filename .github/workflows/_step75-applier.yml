name: STEP 7.5 Temporary Refactor Applier

# Temporary branch-only tool. Removed before final QA/merge.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_step75-applier.yml'
      - 'scripts/_step75_apply.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: python scripts/_step75_apply.py
      - name: Commit exact-match non-workflow refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppCorrected.tsx src/policy-simulation.css scripts/validate_policy_simulation.py
          git diff --cached --check
          git commit -m 'refactor: apply STEP 7.5 exact-match cleanup'
          git push origin HEAD:${GITHUB_HEAD_REF}
