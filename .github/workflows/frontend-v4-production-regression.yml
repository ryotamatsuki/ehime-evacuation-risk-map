name: Frontend v4 Production Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/test_frontend_v4_contract.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-v4-production-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/test_frontend_v4_contract.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-v4-production-regression.yml'

permissions:
  contents: read
  actions: read

jobs:
  production-real-data-ui-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve latest successful main production run
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/routing-step2.yml/runs?branch=main&status=success&event=push&per_page=1"
          response="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$response")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$response")"
          test -n "$run_id"
          test -n "$head_sha"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Latest successful production run: $run_id ($head_sha)"

      - name: Download corrected production export
        uses: actions/download-artifact@v4
        with:
          name: corrected-final-export
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ steps.production.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify production artifact provenance
        env:
          EXPECTED_SHA: ${{ steps.production.outputs.head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path('public/data/metadata/analysis.json').read_text(encoding='utf-8'))
          assert metadata['analysis_version'] == 'analysis-core-v4-corrected-public', metadata
          assert metadata['analysis_source_sha'] == os.environ['EXPECTED_SHA'], metadata
          assert metadata['target_meshes'] == 1090, metadata
          print(f"production artifact provenance PASS: {metadata['analysis_source_sha']}")
          PY

      - name: Run real-data UI projection regression
        run: python tests/test_frontend_v4_contract.py

      - name: Build UI against production export
        run: |
          npm ci
          npm run build
