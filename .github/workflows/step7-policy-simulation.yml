name: STEP 7 Policy Simulation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/AppWithSimulation.tsx'
      - 'src/PolicySimulation.tsx'
      - 'src/policySimulation.ts'
      - 'src/policy-simulation.css'
      - 'src/main.tsx'
      - 'scripts/validate_policy_simulation.py'
      - 'tests/test_policy_simulation_contract.py'
      - 'tests/webkit_smoke.mjs'
      - 'docs/step7-policy-simulation.md'
      - '.github/workflows/step7-policy-simulation.yml'
  push:
    branches: [main]
    paths:
      - 'src/AppWithSimulation.tsx'
      - 'src/PolicySimulation.tsx'
      - 'src/policySimulation.ts'
      - 'src/policy-simulation.css'
      - 'src/main.tsx'
      - 'scripts/validate_policy_simulation.py'
      - 'tests/test_policy_simulation_contract.py'
      - 'tests/webkit_smoke.mjs'
      - 'docs/step7-policy-simulation.md'
      - '.github/workflows/step7-policy-simulation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  policy-simulation-production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify STEP 7 source contract
        run: pytest -q tests/test_policy_simulation_contract.py

      - name: Resolve latest successful corrected main production run
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/routing-step2.yml/runs?branch=main&status=success&event=push&per_page=1"
          response="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$response")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$response")"
          test -n "$run_id"
          test -n "$head_sha"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Latest successful corrected production run: $run_id ($head_sha)"

      - name: Download corrected production export
        uses: actions/download-artifact@v4
        with:
          name: corrected-final-export
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ steps.production.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify production data provenance
        env:
          EXPECTED_SHA: ${{ steps.production.outputs.head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path('public/data/metadata/analysis.json').read_text(encoding='utf-8'))
          assert metadata['analysis_version'] == 'analysis-core-v4-corrected-public', metadata
          assert metadata['analysis_source_sha'] == os.environ['EXPECTED_SHA'], metadata
          assert metadata['target_meshes'] == 1090, metadata
          assert metadata['complete_routes'] == 1062, metadata
          assert metadata['route_unavailable'] == 28, metadata
          assert metadata['cross_border_routes'] == 13, metadata
          print(f"STEP 7 input provenance PASS: {metadata['analysis_source_sha']}")
          PY

      - name: Validate production policy simulation scenarios
        run: |
          python scripts/validate_policy_simulation.py \
            --public-data-root public/data \
            --out data/qa/step7/policy_simulation_summary.json

      - name: Verify production scenario gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qa = json.loads(Path('data/qa/step7/policy_simulation_summary.json').read_text(encoding='utf-8'))
          assert qa['release_gate']['pass'] is True, qa
          assert qa['baseline']['complete_scores'] == 813, qa
          assert qa['baseline']['noncomplete_rows'] == 277, qa
          assert qa['baseline']['over_capacity_shelters'] == 35, qa
          assert len(qa['scenarios']) == 3, qa
          print('STEP 7 production scenarios PASS')
          for scenario in qa['scenarios']:
              print(
                  f"+{int(scenario['capacity_delta'])}: "
                  f"overload {scenario['simulated_over_capacity_shelters']}, "
                  f"resolved {scenario['resolved_over_capacity_shelters']}, "
                  f"score improvement {scenario['total_score_reduction']:.4f}"
              )
          PY

      - name: Build production UI with v4 regression gate
        run: |
          npm ci
          npm run build

      - name: Upload STEP 7 policy simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step7-policy-simulation
          path: data/qa/step7
          retention-days: 30
