name: STEP 6 Production WebKit Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'STATUS_20260822.md'
      - 'docs/**'
      - 'src/**'
      - 'tests/webkit_smoke.mjs'
      - 'tests/test_step6_documentation.py'
      - '.github/workflows/step6-webkit-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'STATUS_20260822.md'
      - 'docs/**'
      - 'src/**'
      - 'tests/webkit_smoke.mjs'
      - 'tests/test_step6_documentation.py'
      - '.github/workflows/step6-webkit-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  production-webkit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify synchronized documentation contract
        run: pytest -q tests/test_step6_documentation.py

      - name: Resolve latest successful corrected main production run
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/routing-step2.yml/runs?branch=main&status=success&event=push&per_page=1"
          response="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$response")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$response")"
          test -n "$run_id"
          test -n "$head_sha"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Latest successful corrected production run: $run_id ($head_sha)"

      - name: Download corrected production export
        uses: actions/download-artifact@v4
        with:
          name: corrected-final-export
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ steps.production.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify production data provenance
        env:
          EXPECTED_SHA: ${{ steps.production.outputs.head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path('public/data/metadata/analysis.json').read_text(encoding='utf-8'))
          assert metadata['analysis_version'] == 'analysis-core-v4-corrected-public', metadata
          assert metadata['analysis_source_sha'] == os.environ['EXPECTED_SHA'], metadata
          assert metadata['target_meshes'] == 1090, metadata
          assert metadata['complete_routes'] == 1062, metadata
          assert metadata['route_unavailable'] == 28, metadata
          assert metadata['cross_border_routes'] == 13, metadata
          print(f"STEP 6 input provenance PASS: {metadata['analysis_source_sha']}")
          PY

      - name: Build production UI with v4 regression gate
        run: |
          npm ci
          npm run build

      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Validate WebKit smoke script syntax
        run: node --check tests/webkit_smoke.mjs

      - name: Start Vite production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 > /tmp/ehime-vite-preview.log 2>&1 &
          echo $! > /tmp/ehime-vite-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ehime-evacuation-risk-map/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ehime-vite-preview.log
          exit 1

      - name: Run desktop and iPhone-equivalent WebKit production smoke
        env:
          BASE_URL: http://127.0.0.1:4173/ehime-evacuation-risk-map/
        run: node tests/webkit_smoke.mjs

      - name: Upload STEP 6 browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step6-webkit-smoke
          path: data/qa/step6
          retention-days: 30
