name: Temporary verify merged main Pages

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-main-pages-temp.yml'

permissions:
  contents: read

jobs:
  verify-live-main-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Pages metadata and deployed UI bundle
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ryotamatsuki.github.io/ehime-evacuation-risk-map'
          EXPECTED_SHA='9febc7c97de988f7f6b0333a58bffd925b39a752'

          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            "$BASE/data/metadata/analysis.json" -o /tmp/analysis.json
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            "$BASE/" -o /tmp/index.html

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          expected = '9febc7c97de988f7f6b0333a58bffd925b39a752'
          analysis = json.loads(Path('/tmp/analysis.json').read_text(encoding='utf-8'))
          assert analysis['analysis_version'] == 'analysis-core-v4-corrected-public', analysis
          assert analysis['analysis_source_sha'] == expected, analysis
          assert analysis['target_meshes'] == 1090, analysis
          assert analysis['complete_routes'] == 1062, analysis
          assert analysis['route_unavailable'] == 28, analysis
          assert analysis['cross_border_routes'] == 13, analysis
          run_id = str(analysis['workflow_run_id'])
          assert run_id.isdigit(), run_id
          html = Path('/tmp/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script[^>]+src="([^"]+\.js)"', html)
          assert match, html[:1000]
          print(f'LIVE_MAIN_RUN_ID={run_id}')
          print(f'LIVE_ANALYSIS_SOURCE_SHA={analysis["analysis_source_sha"]}')
          print(f'LIVE_JS_PATH={match.group(1)}')
          Path('/tmp/js-path.txt').write_text(match.group(1), encoding='utf-8')
          PY

          JS_PATH="$(cat /tmp/js-path.txt)"
          case "$JS_PATH" in
            http*) JS_URL="$JS_PATH" ;;
            /*) JS_URL="https://ryotamatsuki.github.io$JS_PATH" ;;
            *) JS_URL="$BASE/${JS_PATH#./}" ;;
          esac
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
            "$JS_URL" -o /tmp/app.js

          python - <<'PY'
          from pathlib import Path
          js = Path('/tmp/app.js').read_text(encoding='utf-8')
          required = [
              'ブラウザ側で重み変更・再正規化は行いません',
              '不明（収容人数未公表）',
              '赤線＝STEP 3で判定した津波浸水区間',
          ]
          for token in required:
              assert token in js, f'live deployed bundle missing: {token}'
          forbidden = [
              'STEP 4再計算待ち',
              '浸水区間の部分着色はSTEP 3後',
          ]
          for token in forbidden:
              assert token not in js, f'live deployed bundle still contains legacy copy: {token}'
          print('LIVE_PAGES_UI_BUNDLE=PASS')
          PY
