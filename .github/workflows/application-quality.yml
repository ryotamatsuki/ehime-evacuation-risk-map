name: STEP 7.5 Application Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'README.md'
      - 'STATUS_*.md'
      - 'scripts/README.md'
      - 'docs/**'
      - 'scripts/analyze_step5_sensitivity.py'
      - 'scripts/validate_policy_simulation.py'
      - 'scripts/verify_production_regression.py'
      - 'tests/test_frontend_v4_contract.py'
      - 'tests/test_policy_simulation_contract.py'
      - 'tests/test_step5_sensitivity.py'
      - 'tests/test_step6_documentation.py'
      - 'tests/test_step75_debt_contract.py'
      - 'tests/production_regression_baseline.json'
      - 'tests/webkit_smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/application-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'README.md'
      - 'STATUS_*.md'
      - 'scripts/README.md'
      - 'docs/**'
      - 'scripts/analyze_step5_sensitivity.py'
      - 'scripts/validate_policy_simulation.py'
      - 'scripts/verify_production_regression.py'
      - 'tests/test_frontend_v4_contract.py'
      - 'tests/test_policy_simulation_contract.py'
      - 'tests/test_step5_sensitivity.py'
      - 'tests/test_step6_documentation.py'
      - 'tests/test_step75_debt_contract.py'
      - 'tests/production_regression_baseline.json'
      - 'tests/webkit_smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/application-quality.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  application-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies once
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Run source/documentation/debt contracts
        run: >-
          pytest -q
          tests/test_step5_sensitivity.py
          tests/test_step6_documentation.py
          tests/test_policy_simulation_contract.py
          tests/test_step75_debt_contract.py

      - name: Resolve latest successful corrected main production run
        id: production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/routing-step2.yml/runs?branch=main&status=success&event=push&per_page=1"
          response="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"
          run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$response")"
          head_sha="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$response")"
          test -n "$run_id"
          test -n "$head_sha"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Latest successful corrected production run: $run_id ($head_sha)"

      - name: Download production artifact once
        uses: actions/download-artifact@v4
        with:
          name: corrected-final-export
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ steps.production.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify production provenance
        env:
          EXPECTED_SHA: ${{ steps.production.outputs.head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path('public/data/metadata/analysis.json').read_text(encoding='utf-8'))
          assert metadata['analysis_version'] == 'analysis-core-v4-corrected-public', metadata
          assert metadata['analysis_source_sha'] == os.environ['EXPECTED_SHA'], metadata
          assert metadata['target_meshes'] == 1090, metadata
          assert metadata['complete_routes'] == 1062, metadata
          assert metadata['route_unavailable'] == 28, metadata
          assert metadata['cross_border_routes'] == 13, metadata
          print(f"production input provenance PASS: {metadata['analysis_source_sha']}")
          PY

      - name: Recompute STEP 5 robustness on production artifact
        run: |
          python scripts/analyze_step5_sensitivity.py \
            --public-data-root public/data \
            --out-mesh-csv data/step5/mesh_robustness.csv \
            --out-summary data/step5/sensitivity_summary.json \
            --out-qa data/qa/step5/step5_summary.json \
            --expected-rows 1090

      - name: Recompute STEP 7 counterfactual on production artifact
        run: |
          python scripts/validate_policy_simulation.py \
            --public-data-root public/data \
            --out data/qa/step7/policy_simulation_summary.json

      - name: Verify cross-stage production regression baseline
        run: |
          python scripts/verify_production_regression.py \
            --baseline tests/production_regression_baseline.json \
            --metadata public/data/metadata/analysis.json \
            --step5 data/qa/step5/step5_summary.json \
            --step7 data/qa/step7/policy_simulation_summary.json

      - name: Build production UI with v4 real-data regression
        run: npm run build

      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Validate browser test syntax
        run: node --check tests/webkit_smoke.mjs

      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 > /tmp/ehime-vite-preview.log 2>&1 &
          echo $! > /tmp/ehime-vite-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ehime-evacuation-risk-map/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ehime-vite-preview.log
          exit 1

      - name: Run desktop and iPhone-equivalent WebKit production smoke
        env:
          BASE_URL: http://127.0.0.1:4173/ehime-evacuation-risk-map/
        run: node tests/webkit_smoke.mjs

      - name: Upload consolidated quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step75-application-quality
          path: |
            data/qa/step5/step5_summary.json
            data/qa/step7/policy_simulation_summary.json
            data/qa/step6/webkit_smoke.json
          retention-days: 30
