name: Legacy Static Pages Build (manual only)

# Do not attach this workflow to main pushes. The corrected production Pages
# deployment is gated by Analysis Core STEP 2-4 + Corrected Public Export and
# uses same-run STEP 4 artifacts rather than the legacy committed risk/routes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build only - no deployment
        run: npm run build
